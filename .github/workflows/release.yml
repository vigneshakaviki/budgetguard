name: Release to PyPI

# Publishes to PyPI whenever a GitHub Release is published, using PyPI
# Trusted Publishing (OIDC) -- no API token is stored in the repo.
#
# One-time setup on pypi.org (Account -> Publishing -> Add a pending publisher):
#   PyPI project name: budgetguard
#   Owner:             vigneshakaviki
#   Repository:        budgetguard
#   Workflow name:     release.yml
#   Environment:       pypi

on:
  release:
    types: [published]

jobs:
  pypi-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build
      - name: Verify the version matches the release tag
        run: |
          python - <<'PY'
          import os, tomllib
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          ver = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          assert tag == ver, f"tag {tag!r} != pyproject version {ver!r}"
          print("version ok:", ver)
          PY
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
