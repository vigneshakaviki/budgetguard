[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "budgetguard"
version = "0.2.0"
description = "Drop-in budget, rate, and loop guard for autonomous AI agents. Framework-agnostic."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "budgetguard contributors" }]
keywords = ["ai", "agents", "llm", "budget", "cost", "guardrail", "rate-limit", "openai", "anthropic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
redis = ["redis>=5.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "fakeredis>=2.20"]

[project.urls]
Homepage = "https://github.com/budgetguard/budgetguard"
Issues = "https://github.com/budgetguard/budgetguard/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/budgetguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
